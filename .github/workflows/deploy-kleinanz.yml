name: Deploy Kleinanzeigen Laravel 12

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup SSH for secure connection to PHP hosting
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.LIMA_SSH_PRIVATE_KEY }}

    - name: Add SSH key to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.LIMA_SFTP_HOST }} >> ~/.ssh/known_hosts

    - name: Test SSH connection
      env:
        SFTP_HOST: ${{ secrets.LIMA_SFTP_HOST }}
        SFTP_USERNAME: ${{ secrets.LIMA_SFTP_USERNAME }}
      run: |
        ssh $SFTP_USERNAME@$SFTP_HOST "echo -------- Connection Successful --------"

    # Sync only the larasvelte/ app folder directly into kleinanz/ on server
    # (same pattern as oe-app: src/ → oe-app/)
    - name: Upload files via rsync
      env:
        SFTP_HOST: ${{ secrets.LIMA_SFTP_HOST }}
        SFTP_USERNAME: ${{ secrets.LIMA_SFTP_USERNAME }}
      run: |
        rsync -r --delete-after --quiet \
          --exclude '/.github/' \
          --exclude '/vendor/' \
          --exclude '/node_modules/' \
          --exclude '/tests/' \
          --exclude '/stubs/' \
          --exclude '*.md' \
          --exclude '/storage/logs/' \
          --exclude '/storage/app/*' \
          --exclude '/bootstrap/cache/' \
          --exclude '/database/database.sqlite' \
          --exclude '/.env' \
          --exclude '/.venv/' \
          --exclude '/.python-packages/' \
          --exclude '/public/build/' \
          --exclude '/public/hot' \
          $GITHUB_WORKSPACE/larasvelte/ $SFTP_USERNAME@$SFTP_HOST:kleinanz/

    - name: Upload ONNX model for auto-crop
      env:
        SFTP_HOST: ${{ secrets.LIMA_SFTP_HOST }}
        SFTP_USERNAME: ${{ secrets.LIMA_SFTP_USERNAME }}
      run: |
        set -euo pipefail
        MODEL_SOURCE="$GITHUB_WORKSPACE/no_laravel/migration_source/kleinanz-slim/models/yolov8n-fashionpedia-1.onnx"
        test -f "$MODEL_SOURCE" || { echo "❌ Missing model in repo: $MODEL_SOURCE"; exit 1; }

        ssh $SFTP_USERNAME@$SFTP_HOST 'mkdir -p kleinanz/storage/models'
        rsync -r --quiet "$MODEL_SOURCE" \
          $SFTP_USERNAME@$SFTP_HOST:kleinanz/storage/models/yolov8n-fashionpedia-1.onnx
        echo "✓ ONNX model synced"

    - name: Validate deployment variables
      env:
        PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        PRODUCTION_ENV_OVERRIDES: ${{ secrets.KLEINANZ_ENV_VARIABLES }}
      run: |
        if [ -z "${PRODUCTION_URL:-}" ]; then
          echo "GitHub Actions variable PRODUCTION_URL is required." >&2
          exit 1
        fi

        if [ -z "${PRODUCTION_ENV_OVERRIDES:-}" ]; then
          echo "GitHub Actions secret KLEINANZ_ENV_VARIABLES is required." >&2
          exit 1
        fi

    # The secret contains the complete production .env; APP_URL comes from PRODUCTION_URL.
    - name: Validate and prepare production .env
      env:
        PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        PRODUCTION_ENV_OVERRIDES: ${{ secrets.KLEINANZ_ENV_VARIABLES }}
      run: |
        set -euo pipefail
        printf '%s\n' "$PRODUCTION_ENV_OVERRIDES" > .env.production

        expected_keys="$(mktemp)"
        production_keys="$(mktemp)"
        trap 'rm -f "$expected_keys" "$production_keys"' EXIT

        awk -F= '/^[A-Z][A-Z0-9_]*=/ { print $1 }' "$GITHUB_WORKSPACE/larasvelte/.env.example" > "$expected_keys"
        awk -F= '/^[A-Z][A-Z0-9_]*=/ { print $1 }' .env.production > "$production_keys"

        if ! diff -u "$expected_keys" "$production_keys"; then
          echo "KLEINANZ_ENV_VARIABLES must contain every .env.example key in the same order." >&2
          exit 1
        fi

        app_url_count=0
        while IFS= read -r override || [ -n "$override" ]; do
          case "$override" in
            ''|'#'*) continue ;;
          *=*) ;;
            *) echo "Invalid production environment entry: $override" >&2; exit 1 ;;
          esac

          key="${override%%=*}"
          case "$key" in
            ''|*[!A-Z0-9_]*) echo "Invalid production environment key: $key" >&2; exit 1 ;;
          esac

          if [ "$key" = "APP_URL" ]; then
            app_url_count=$((app_url_count + 1))
          fi
        done <<< "$PRODUCTION_ENV_OVERRIDES"

        if [ "$app_url_count" -ne 1 ]; then
          echo "Production environment must include exactly one APP_URL line." >&2
          exit 1
        fi

        tmp_file="$(mktemp)"
        awk -v url="$PRODUCTION_URL" '
          /^APP_URL=/ { print "APP_URL=" url; next }
          { print }
        ' .env.production > "$tmp_file"
        mv "$tmp_file" .env.production

        echo "✓ Production .env prepared"

    - name: Upload production .env
      env:
        SFTP_HOST: ${{ secrets.LIMA_SFTP_HOST }}
        SFTP_USERNAME: ${{ secrets.LIMA_SFTP_USERNAME }}
      run: |
        cat .env.production | ssh $SFTP_USERNAME@$SFTP_HOST 'cat > kleinanz/.env'
        echo "✓ Uploaded production .env"

    # Run deployment steps on server
    - name: Deploy application
      env:
        SFTP_HOST: ${{ secrets.LIMA_SFTP_HOST }}
        SFTP_USERNAME: ${{ secrets.LIMA_SFTP_USERNAME }}
      run: |
        ssh $SFTP_USERNAME@$SFTP_HOST << 'DEPLOY_EOF'
        set -euo pipefail
        cd kleinanz
        APP_ROOT="$(pwd)"

        PHP_BIN=/opt/lima-php/8.4/bin/php

        echo "▶ Sanity checks before install..."
        echo "Using PHP binary: $PHP_BIN"
        test -f composer.json || { echo "❌ composer.json not found in ~/kleinanz"; exit 1; }
        test -x "$PHP_BIN" || { echo "❌ PHP binary not found or not executable: $PHP_BIN"; exit 1; }
        COMPOSER_BIN=$(command -v composer || true)
        [ -n "$COMPOSER_BIN" ] || { echo "❌ composer is not available on server PATH"; exit 1; }
        "$PHP_BIN" -v
        "$COMPOSER_BIN" --version

        echo "▶ Preparing Laravel writable directories..."
        mkdir -p bootstrap/cache storage/framework/{cache,sessions,testing,views} storage/logs
        chmod -R u+rwX bootstrap/cache storage
        test -d bootstrap/cache || { echo "❌ bootstrap/cache could not be created"; exit 1; }
        test -w bootstrap/cache || { echo "❌ bootstrap/cache is not writable"; exit 1; }

        test -f "$APP_ROOT/storage/models/yolov8n-fashionpedia-1.onnx" || {
          echo "❌ ONNX model missing on server: $APP_ROOT/storage/models/yolov8n-fashionpedia-1.onnx"
          exit 1
        }

        echo "▶ Installing Composer dependencies..."
        "$PHP_BIN" "$COMPOSER_BIN" install --no-dev --no-interaction --prefer-dist --optimize-autoloader

        echo "▶ Checking Composer platform requirements..."
        "$PHP_BIN" "$COMPOSER_BIN" check-platform-reqs

        echo "▶ Verifying Laravel autoloader..."
        test -f vendor/autoload.php || { echo "❌ vendor/autoload.php missing after composer install"; exit 1; }

        echo "▶ Installing Node dependencies..."
        npm install

        echo "▶ Building frontend assets..."
        npm run build

        if grep -Eq '^APP_KEY=.+$' .env; then
          echo "▶ APP_KEY already present, skipping key generation..."
        else
          echo "▶ APP_KEY missing, generating application key..."
          "$PHP_BIN" artisan key:generate --force
        fi

        echo "▶ Running database migrations..."
        "$PHP_BIN" artisan migrate --force

        echo "▶ Caching configuration..."
        "$PHP_BIN" artisan config:clear
        "$PHP_BIN" artisan config:cache

        echo "▶ Caching routes..."
        "$PHP_BIN" artisan route:cache

        echo "▶ Creating storage link..."
        if [ -L public/storage ] || [ -e public/storage ]; then
          echo "✓ public/storage already exists, skipping storage:link"
        else
          "$PHP_BIN" artisan storage:link
        fi

        echo "▶ Setting up project-local Python packages for auto-crop..."
        PYTHON_BIN=python3
        PYTHON_PACKAGES_DIR=.python-packages
        test -x "$(command -v "$PYTHON_BIN")" || { echo "❌ python3 is not available on server PATH"; exit 1; }
        "$PYTHON_BIN" --version
        mkdir -p "$PYTHON_PACKAGES_DIR"

        if PYTHONPATH="$PWD/$PYTHON_PACKAGES_DIR${PYTHONPATH:+:$PYTHONPATH}" \
          "$PYTHON_BIN" -c "import numpy, PIL, onnxruntime" >/dev/null 2>&1; then
          echo "✓ Python dependencies already available"
        else
          "$PYTHON_BIN" -m pip --version >/dev/null 2>&1 || {
            echo "❌ pip is unavailable for python3 on the host"
            exit 1
          }
          "$PYTHON_BIN" -m pip install --quiet --target "$PYTHON_PACKAGES_DIR" -r scripts/requirements-auto-crop.txt
          PYTHONPATH="$PWD/$PYTHON_PACKAGES_DIR${PYTHONPATH:+:$PYTHONPATH}" \
            "$PYTHON_BIN" -c "import numpy, PIL, onnxruntime" >/dev/null 2>&1 || {
              echo "❌ Python dependencies were installed but cannot be imported"
              exit 1
            }
          echo "✓ Python dependencies installed"
        fi

        echo "▶ One-shot queue drain for pending jobs (shared hosting)..."
        "$PHP_BIN" artisan queue:work --queue=default --stop-when-empty --tries=3 --timeout=90 --sleep=1 --max-jobs=25 || true

        echo "✅ Deployment completed successfully!"
        DEPLOY_EOF

    - name: Deployment Success Notification
      env:
        PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      run: |
        echo "🎉 Deployment to production completed!"
        echo "App URL: $PRODUCTION_URL"
