# Kopiere diese Datei zu `.streamlit/secrets.toml` (nicht ins Git einchecken!)

# === Streamlit Auth ===
AUTH_COOKIE_NAME = "anzeigen_auth_session"
AUTH_COOKIE_SECRET = "insecure-change-me"


# === OpenAI / Textgenerierung ===
DEFAULT_USE_MOCK_API = true
OPENAI_API_KEY = "sk-..."
OPENAI_MODEL = "gpt-4o-mini"
MAX_TOKENS = 1000
TEMPERATURE = 0.7
TIMEOUT_SECONDS = 30
DEFAULT_DISCLAIMER = ""

# === Bildverarbeitung ===
MAX_IMAGE_SIZE = 1000
JPEG_QUALITY = 90
PROGRESSIVE_JPEG = true
SUPPORTED_FORMATS = "jpg,jpeg,png,avif"

# === Datenspeicher ===
# Für lokale Entwicklung reicht SQLite:
# DATABASE_URL = "sqlite:///data/ads.db"
# Für MySQL/MariaDB (z.B. PlanetScale):
# DATABASE_URL = "mysql+mysqlconnector://user:pass@host:3306/dbname"
DATABASE_URL = "sqlite:///data/ads.db"
DATA_DIR = "data"
